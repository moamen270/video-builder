[project]
name = "vb-chatterbox"
version = "0.1.0"
description = "Chatterbox (Resemble AI, MIT) voice engine for video-builder: directable TTS + forced word alignment"
# Separate project from py/ on purpose: chatterbox pins torch 2.6.0 (CUDA) while Kokoro runs on current CPU torch.
requires-python = ">=3.11,<3.12"
dependencies = [
    "chatterbox-tts>=0.1.6",
    # Listed explicitly so the [tool.uv.sources] index pin applies (transitive torch would resolve to the PyPI CPU wheel).
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "soundfile>=0.13",
    "numpy>=1.24,<2",
    # resemble-perth (the mandatory watermarker) imports pkg_resources, removed in setuptools 81.
    "setuptools<81",
]

[project.scripts]
vb-chatterbox = "vb_chatterbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vb_chatterbox"]

[tool.uv]
index-strategy = "unsafe-best-match"

# CUDA 12.6 wheels: the GTX 1660 (Turing) runs Turbo at ~0.7x real time; CPU works but is ~10x slower.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
