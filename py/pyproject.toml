[project]
name = "vb-audio"
version = "0.1.0"
description = "Kokoro TTS + word-level alignment for video-builder"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kokoro>=0.9.4",
    "misaki[en]>=0.9.4",
    "soundfile>=0.13",
    "numpy>=1.26",
    "torch>=2.4",
    "transformers>=4.45",
    "scipy>=1.11",
    "accelerate>=1.0",
]

[project.scripts]
vb-audio = "vb_audio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vb_audio"]

[tool.uv]
# CPU torch is enough for Kokoro-82M (faster than realtime). Switch to the cu124
# index if GPU synthesis is ever needed.
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
